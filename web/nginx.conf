server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # For Phase 7 (Vite SPA): serve index.html for all routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the adminapi service (used by Phase 7 Vite dev proxy too).
    # In Phase 1 this block is present but the dashboard only serves static content.
    location /api/ {
        proxy_pass         http://adminapi:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # Health endpoint for compose healthcheck.
    location /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"dashboard"}';
        add_header Content-Type application/json;
    }
}
