<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Gate — Admin Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      max-width: 480px;
    }
    .badge {
      display: inline-block;
      background: #0ea5e9;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    p  { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    code {
      display: inline-block;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.85rem;
      color: #7dd3fc;
    }
    .phase { margin-top: 2rem; font-size: 0.8rem; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Phase 1</span>
    <h1>MCP Gate</h1>
    <p>
      Governance proxy for AI agents and MCP servers.<br/>
      The admin dashboard is coming in <strong>Phase 7</strong>.
    </p>
    <p>
      API is available at<br/>
      <code>http://localhost:8081</code>
    </p>
    <p class="phase">Built with React + Vite · TypeScript · shadcn/ui</p>
  </div>
</body>
</html>
